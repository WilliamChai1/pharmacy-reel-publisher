<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharmacy Reel Hub</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; margin: 0; padding: 16px; color: #1e293b; }
    .card { background: white; border-radius: 16px; padding: 20px; max-width: 480px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
    h2 { margin-top: 0; color: #0284c7; font-size: 20px; }
    label { font-weight: 600; font-size: 13px; display: block; margin-top: 14px; }
    input, select, textarea, button { width: 100%; box-sizing: border-box; border-radius: 10px; margin-top: 6px; }
    input[type="text"], input[type="password"], select, textarea { padding: 12px; border: 1px solid #cbd5e1; font-size: 14px; background: #fff; }
    textarea { height: 220px; line-height: 1.4; }
    button { background: #0284c7; color: white; border: none; padding: 14px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 16px; border-radius: 10px; }
    button:disabled { background: #94a3b8; }
    .status { font-size: 13px; color: #64748b; margin-top: 12px; font-weight: 500; line-height: 1.4; word-break: break-all; }
    .btn-green { background: #16a34a; }
    .btn-secondary { background: #475569; }
    .settings-toggle { font-size: 12px; color: #94a3b8; text-decoration: underline; cursor: pointer; margin-top: 20px; display: inline-block; }
    #tokenArea { display: none; margin-top: 10px; padding: 10px; background: #f1f5f9; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>💊 Pharmacy Reel Publisher</h2>
    <p style="font-size: 13px; color: #64748b; margin-top: -5px;">One-stop publishing for Kuching parents & caregivers</p>

    <label>Language / 语言:</label>
    <select id="videoLang">
      <option value="en">English (Uses intro_en & outro_en)</option>
      <option value="zh">中文 (Uses intro_zh & outro_zh)</option>
    </select>

    <label>Video Topic (for Gemini 3.5 Caption):</label>
    <input type="text" id="videoTopic" value="Why kitchen spoons are dangerous for kids">

    <label>Select NotebookLM Video (.mp4):</label>
    <input type="file" id="videoFile" accept="video/mp4">

    <button onclick="startUploadAndProcess()" id="actionBtn">🚀 Process Video & Generate Caption</button>
    <div class="status" id="statusBox">Ready.</div>

    <hr style="margin: 24px 0; border: none; border-top: 1px solid #e2e8f0;">

    <label>📋 Generated Facebook Caption:</label>
    <textarea id="captionBox" placeholder="Caption generated by Gemini will appear here automatically..."></textarea>
    <button class="btn-secondary" onclick="copyCaption()">📋 Copy Caption</button>

    <div id="downloadContainer" style="display: none; margin-top: 14px;">
      <a id="directVideoDownload" href="#" download="clean_pharmacy_reel.mp4" style="text-decoration:none;">
        <button class="btn-green">📥 Download Video Directly (.mp4)</button>
      </a>
    </div>

    <!-- Hidden Token Settings -->
    <span class="settings-toggle" onclick="toggleSettings()">⚙️ Token Settings</span>
    <div id="tokenArea">
      <label style="margin-top:0;">GitHub PAT (Saved on this phone):</label>
      <input type="password" id="githubToken" placeholder="Paste ghp_xxxx here">
      <button onclick="saveToken()" style="padding: 8px; margin-top: 8px; background: #334155;">Save Token</button>
    </div>
  </div>

  <script>
    const REPO = "WilliamChai1/pharmacy-reel-publisher";

    document.getElementById("githubToken").value = localStorage.getItem("gh_pat") || "";

    function toggleSettings() {
      const area = document.getElementById("tokenArea");
      area.style.display = area.style.display === "block" ? "none" : "block";
    }

    function saveToken() {
      const token = document.getElementById("githubToken").value.trim();
      if(token) {
        localStorage.setItem("gh_pat", token);
        alert("Token saved successfully!");
        toggleSettings();
      }
    }

    function updateStatus(msg) {
      document.getElementById("statusBox").innerHTML = msg;
    }

    function copyCaption() {
      const box = document.getElementById("captionBox");
      if(!box.value) {
        alert("No caption to copy yet!");
        return;
      }
      box.select();
      navigator.clipboard.writeText(box.value);
      alert("Caption copied! Ready to paste into Facebook.");
    }

    async function startUploadAndProcess() {
      const token = localStorage.getItem("gh_pat") || document.getElementById("githubToken").value.trim();
      const lang = document.getElementById("videoLang").value;
      const topic = document.getElementById("videoTopic").value.trim();
      const fileInput = document.getElementById("videoFile").files[0];

      if (!token) {
        alert("Please tap '⚙️ Token Settings' and save your GitHub Token first.");
        toggleSettings();
        return;
      }
      if (!fileInput) {
        alert("Please select a video file first.");
        return;
      }

      const btn = document.getElementById("actionBtn");
      btn.disabled = true;

      try {
        updateStatus("⏳ 1/3 Uploading video to GitHub (takes 10-25s)...");
        
        const reader = new FileReader();
        reader.readAsDataURL(fileInput);
        reader.onload = async () => {
          const contentBase64 = reader.result.split(',')[1];
          
          let sha = "";
          try {
            const checkRes = await fetch(`https://api.github.com/repos/${REPO}/contents/input.mp4?t=${Date.now()}`, {
              headers: { 
                "Authorization": `Bearer ${token}`,
                "Accept": "application/vnd.github+json"
              },
              cache: "no-store"
            });
            if (checkRes.ok) {
              const data = await checkRes.json();
              sha = data.sha;
            }
          } catch(e) {}

          const uploadRes = await fetch(`https://api.github.com/repos/${REPO}/contents/input.mp4`, {
            method: "PUT",
            headers: {
              "Authorization": `Bearer ${token}`,
              "Content-Type": "application/json",
              "Accept": "application/vnd.github+json"
            },
            body: JSON.stringify({
              message: "Upload input video",
              content: contentBase64,
              sha: sha || undefined
            })
          });

          if (!uploadRes.ok) {
            const errData = await uploadRes.json();
            throw new Error(`Upload failed: ${errData.message || 'Check token permissions'}`);
          }

          updateStatus("⏳ 2/3 Video uploaded! Starting cloud render...");
          
          const dispatchRes = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/process.yml/dispatches`, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${token}`,
              "Content-Type": "application/json",
              "Accept": "application/vnd.github+json"
            },
            body: JSON.stringify({
              ref: "main",
              inputs: { topic: topic, language: lang }
            })
          });

          if (!dispatchRes.ok) {
            const dispErr = await dispatchRes.json();
            throw new Error(`Failed to trigger workflow: ${dispErr.message}`);
          }

          updateStatus("⏳ 3/3 Processing video & caption on cloud... (~50s)");
          setTimeout(() => pollWorkflowStatus(token), 10000);
        };

      } catch (err) {
        updateStatus("❌ Error: " + err.message);
        btn.disabled = false;
      }
    }

    async function pollWorkflowStatus(token) {
      let attempts = 0;
      const interval = setInterval(async () => {
        attempts++;
        try {
          // Explicitly queries process.yml workflow runs only
          const runsRes = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/process.yml/runs?per_page=1&t=${Date.now()}`, {
            headers: { 
              "Authorization": `Bearer ${token}`,
              "Accept": "application/vnd.github+json"
            },
            cache: "no-store"
          });
          
          if (!runsRes.ok) return;

          const runsData = await runsRes.json();
          const latestRun = runsData.workflow_runs[0];

          if (latestRun) {
            if (latestRun.status === "completed") {
              clearInterval(interval);
              if (latestRun.conclusion === "success") {
                updateStatus("✅ Complete! Loading direct download link...");
                
                // Direct raw MP4 download link via GitHub Releases
                const downloadUrl = `https://github.com/${REPO}/releases/download/latest/clean_pharmacy_reel.mp4?t=${Date.now()}`;
                const dlBtn = document.getElementById("directVideoDownload");
                dlBtn.href = downloadUrl;
                document.getElementById("downloadContainer").style.display = "block";
                
                fetchCaptionFile(token);
              } else {
                updateStatus(`❌ Cloud run failed. <a href="${latestRun.html_url}" target="_blank">View Error Log on GitHub</a>`);
                document.getElementById("actionBtn").disabled = false;
              }
            } else {
              updateStatus(`⏳ Processing on cloud... (${attempts * 5 + 10}s) <br><span style="font-size:11px;color:#94a3b8;">Status: ${latestRun.status}</span>`);
            }
          }
        } catch(e) {
          console.error("Polling error: ", e);
        }
      }, 5000);
    }

    async function fetchCaptionFile(token) {
      try {
        const fileRes = await fetch(`https://api.github.com/repos/${REPO}/contents/caption.txt?t=${Date.now()}`, {
          headers: { 
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github+json"
          },
          cache: "no-store"
        });
        
        if (fileRes.ok) {
          const data = await fileRes.json();
          const binaryString = atob(data.content.replace(/\s/g, ''));
          const bytes = new Uint8Array(binaryString.length);
          for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          const decodedCaption = new TextDecoder('utf-8').decode(bytes);
          
          document.getElementById("captionBox").value = decodedCaption;
          updateStatus("🎉 Video & caption ready! Tap below to download the MP4 directly.");
        }
      } catch (err) {
        console.error("Caption decoding error: ", err);
      }
      document.getElementById("actionBtn").disabled = false;
    }
  </script>
</body>
</html>
