<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharmacy Reel Hub</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; margin: 0; padding: 20px; color: #1e293b; }
    .card { background: white; border-radius: 16px; padding: 22px; max-width: 480px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
    h2 { margin-top: 0; color: #0284c7; font-size: 20px; }
    label { font-weight: 600; font-size: 13px; display: block; margin-top: 14px; }
    input, select, textarea, button { width: 100%; box-sizing: border-box; border-radius: 10px; margin-top: 6px; }
    input[type="text"], input[type="password"], select, textarea { padding: 12px; border: 1px solid #cbd5e1; font-size: 14px; background: #fff; }
    textarea { height: 200px; }
    button { background: #0284c7; color: white; border: none; padding: 14px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 16px; transition: background 0.2s; }
    button:active { background: #0369a1; }
    .status { font-size: 13px; color: #64748b; margin-top: 10px; font-weight: 500; }
    .btn-green { background: #16a34a; }
    .btn-secondary { background: #475569; }
    .settings-toggle { font-size: 12px; color: #94a3b8; text-decoration: underline; cursor: pointer; margin-top: 20px; display: inline-block; }
    #tokenArea { display: none; margin-top: 10px; padding: 10px; background: #f1f5f9; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>💊 Pharmacy Reel Publisher</h2>
    <p style="font-size: 13px; color: #64748b; margin-top: -5px;">One-stop publishing for Kuching parents & caregivers</p>

    <!-- Main Clean Controls -->
    <label>Language / 语言:</label>
    <select id="videoLang">
      <option value="en">English (Uses intro_en & outro_en)</option>
      <option value="zh">中文 (Uses intro_zh & outro_zh)</option>
    </select>

    <label>Video Topic (for Gemini Caption):</label>
    <input type="text" id="videoTopic" value="Why kitchen spoons are dangerous for kids and how to dose syrup easily">

    <label>Select NotebookLM Video (.mp4):</label>
    <input type="file" id="videoFile" accept="video/mp4">

    <button onclick="startUploadAndProcess()" id="actionBtn">🚀 Process Video & Generate Caption</button>
    <div class="status" id="statusBox">Ready.</div>

    <hr style="margin: 24px 0; border: none; border-top: 1px solid #e2e8f0;">

    <label>📋 Generated Facebook Caption:</label>
    <textarea id="captionBox" placeholder="Caption generated by Gemini 3.5 will appear here..."></textarea>
    <button class="btn-secondary" onclick="copyCaption()">📋 Copy Caption</button>

    <div id="downloadContainer" style="display: none;">
      <a id="downloadBtnLink" href="#" target="_blank">
        <button class="btn-green">📥 Download Finished 9:16 Video</button>
      </a>
    </div>

    <!-- Hidden Setup (Stored Once in Browser) -->
    <span class="settings-toggle" onclick="toggleSettings()">⚙️ Token Settings</span>
    <div id="tokenArea">
      <label style="margin-top:0;">GitHub PAT (Stored securely in browser):</label>
      <input type="password" id="githubToken" placeholder="Paste ghp_xxxx here">
      <button onclick="saveToken()" style="padding: 8px; margin-top: 8px; background: #334155;">Save Token</button>
    </div>
  </div>

  <script>
    const REPO = "williamchai1/pharmacy-reel-publisher";

    // Auto-load token from browser storage
    const savedToken = localStorage.getItem("gh_pat") || "";
    document.getElementById("githubToken").value = savedToken;

    function toggleSettings() {
      const area = document.getElementById("tokenArea");
      area.style.display = area.style.display === "block" ? "none" : "block";
    }

    function saveToken() {
      const token = document.getElementById("githubToken").value.trim();
      if(token) {
        localStorage.setItem("gh_pat", token);
        alert("Token saved successfully!");
        toggleSettings();
      }
    }

    function updateStatus(msg) {
      document.getElementById("statusBox").innerText = msg;
    }

    function copyCaption() {
      const box = document.getElementById("captionBox");
      box.select();
      navigator.clipboard.writeText(box.value);
      alert("Caption copied! Paste straight into Facebook.");
    }

    async function startUploadAndProcess() {
      const token = localStorage.getItem("gh_pat") || document.getElementById("githubToken").value.trim();
      const lang = document.getElementById("videoLang").value;
      const topic = document.getElementById("videoTopic").value.trim();
      const fileInput = document.getElementById("videoFile").files[0];

      if (!token) {
        alert("Please tap '⚙️ Token Settings' below and paste your GitHub Token once.");
        toggleSettings();
        return;
      }
      if (!fileInput) {
        alert("Please select your NotebookLM video file first.");
        return;
      }

      const btn = document.getElementById("actionBtn");
      btn.disabled = true;

      try {
        updateStatus("⏳ 1/3 Uploading video to GitHub...");
        
        const reader = new FileReader();
        reader.readAsDataURL(fileInput);
        reader.onload = async () => {
          const contentBase64 = reader.result.split(',')[1];
          
          let sha = "";
          try {
            const checkRes = await fetch(`https://api.github.com/repos/${REPO}/contents/input.mp4`, {
              headers: { "Authorization": `Bearer ${token}` }
            });
            if (checkRes.ok) {
              const data = await checkRes.json();
              sha = data.sha;
            }
          } catch(e) {}

          const uploadRes = await fetch(`https://api.github.com/repos/${REPO}/contents/input.mp4`, {
            method: "PUT",
            headers: {
              "Authorization": `Bearer ${token}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: "Upload raw NotebookLM video",
              content: contentBase64,
              sha: sha || undefined
            })
          });

          if (!uploadRes.ok) {
            throw new Error("Failed to upload video. Check your PAT permissions (repo & workflow).");
          }

          updateStatus("⏳ 2/3 Triggering Cloud Action (FFmpeg & Gemini 3.5)...");
          
          const dispatchRes = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/process.yml/dispatches`, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${token}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              ref: "main",
              inputs: { topic: topic, language: lang }
            })
          });

          if (!dispatchRes.ok) {
            throw new Error("Failed to trigger workflow.");
          }

          updateStatus("⏳ 3/3 Cloud server is rendering video & generating caption (~45s)...");
          pollWorkflowStatus(token);
        };

      } catch (err) {
        updateStatus("❌ Error: " + err.message);
        btn.disabled = false;
      }
    }

    async function pollWorkflowStatus(token) {
      let attempts = 0;
      const interval = setInterval(async () => {
        attempts++;
        try {
          const runsRes = await fetch(`https://api.github.com/repos/${REPO}/actions/runs?per_page=1`, {
            headers: { "Authorization": `Bearer ${token}` }
          });
          const runsData = await runsRes.json();
          const latestRun = runsData.workflow_runs[0];

          if (latestRun && latestRun.status === "completed") {
            clearInterval(interval);
            if (latestRun.conclusion === "success") {
              updateStatus("✅ Complete! Ready to download.");
              document.getElementById("downloadContainer").style.display = "block";
              document.getElementById("downloadBtnLink").href = `https://github.com/${REPO}/actions/runs/${latestRun.id}`;
              document.getElementById("actionBtn").disabled = false;
            } else {
              updateStatus("❌ Workflow failed on GitHub Actions.");
              document.getElementById("actionBtn").disabled = false;
            }
          } else {
            updateStatus(`⏳ Processing on cloud... (${attempts * 5}s)`);
          }
        } catch(e) {}
      }, 5000);
    }
  </script>
</body>
</html>
