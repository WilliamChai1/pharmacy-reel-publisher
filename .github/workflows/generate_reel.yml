name: Generate 3D Animated Reel

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video Educational Topic'
        required: true
        default: 'Why kitchen spoons are dangerous for kids medicine and how to take syrup easily'

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install edge-tts moviepy requests pillow google-genai

      - name: Run Animation Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_TOPIC: ${{ github.event.inputs.topic }}
        run: |
          python generate_video.py

      - name: Upload Final Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy_reel_${{ github.run_id }}
          path: pharmacy_education_reel.mp4
          retention-days: 7
