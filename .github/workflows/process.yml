name: Process Reel & Generate Caption

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video Educational Topic'
        required: true
        default: 'Liquid medicine safety for kids and why kitchen spoons are dangerous'
      language:
        description: 'Language (en or zh)'
        required: true
        default: 'en'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg bc

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Validate Input Video Exists
        run: |
          if [ ! -f "input.mp4" ]; then
            echo "::error::input.mp4 was not found in repo root! Please make sure the upload completed."
            exit 1
          fi
          echo "Found input.mp4. Size:"
          ls -lh input.mp4

      - name: Run Processing & Caption Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_TOPIC: ${{ github.event.inputs.topic }}
          VIDEO_LANG: ${{ github.event.inputs.language }}
        run: |
          python -u process_and_caption.py

      - name: Commit Caption to Repository
        run: |
          if [ -f "caption.txt" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add caption.txt
            if git diff --staged --quiet; then
              echo "No caption changes to commit."
            else
              git commit -m "chore: auto-update generated caption [skip ci]"
              git push origin main
            fi
          else
            echo "caption.txt not found, skipping commit."
          fi

      - name: Upload Clean Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean_pharmacy_reel
          path: clean_pharmacy_reel.mp4
          if-no-files-found: error
          retention-days: 5

      - name: Upload Caption Artifact
        uses: actions/upload-artifact@v4
        with:
          name: facebook_caption
          path: caption.txt
          if-no-files-found: error
          retention-days: 5
